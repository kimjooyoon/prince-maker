name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.5', channel: stable}
      - uses: actions/checkout@v4
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --wasm --release
