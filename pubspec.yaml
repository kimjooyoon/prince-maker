name: prince_maker
description: A tiny, original stat-raising story game.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - story/story.jsonl
    - story/locales/ko.jsonl
    - story/locales/en.jsonl
    - assets/noa-sprite-sheet.png
    - assets/lumen-personality-sheet.png
    - assets/lumen-character-roster.png
    - assets/generated/character-emotions/
    - assets/generated/event-illustrations/
    - assets/generated/side-scene-illustrations/
    - design/image-design-matrix.jsonl
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
